<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سَل العلماء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e63946;--red2:#c1121f;--orange:#f4845f;--warm:#fff5f0;--sh:0 8px 32px rgba(0,0,0,.2);--sh2:0 4px 16px rgba(230,57,70,.12);}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Tajawal',sans-serif;background:var(--warm);min-height:100vh;overflow-x:hidden;}
.page{display:none;min-height:100vh;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;}
.page.active{display:flex;}
#p-home{background:linear-gradient(170deg,#f4845f 0%,#e63946 50%,#9d0208 100%);position:fixed;overflow:hidden;}
.top-half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;padding:40px 20px 20px;}
.logo-img{width:75%;max-width:280px;height:auto;border-radius:20px;}
.logo-sub{font-family:'Tajawal',sans-serif;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:2px;margin-top:10px;}
.bottom-half{position:relative;z-index:2;padding:0 16px 50px;}
.card{background:rgba(255,255,255,.14);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;}
.tabs-wrap{display:flex;gap:6px;}
.tab-btn{flex:1;padding:10px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.tab-btn.active{background:#fff;color:var(--red);border-color:#fff;}
.search-label{font-size:11px;color:rgba(255,255,255,.75);margin-bottom:6px;font-weight:600;display:block;text-align:center;}
.search-box{display:flex;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.search-input{flex:1;border:none;outline:none;padding:12px 14px;font-family:'Tajawal',sans-serif;font-size:14px;color:#1a1a1a;background:transparent;min-width:0;direction:rtl;}
.search-input::placeholder{color:#ccc;}
.search-go{background:linear-gradient(135deg,var(--red),var(--red2));border:none;padding:0 16px;height:44px;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0;}
.search-go:disabled{opacity:.4;cursor:not-allowed;}
.credits{color:rgba(255,255,255,.3);font-size:10px;text-align:center;}
#p-loading{background:linear-gradient(150deg,#f4845f,#e63946,#9d0208);align-items:center;justify-content:center;text-align:center;padding:32px;gap:20px;}
.ld-mosque{font-size:70px;animation:float 2s ease-in-out infinite;}
.ld-title{font-family:'Amiri',serif;font-size:24px;color:#fff;}
.ld-sub{color:rgba(255,255,255,.9);font-size:18px;font-weight:700;min-height:32px;}
.dots{display:flex;gap:3px;justify-content:center;}
.dots span{width:5px;height:5px;background:rgba(255,255,255,.6);border-radius:50%;animation:bounce 1s infinite;}
.dots span:nth-child(2){animation-delay:.15s;}
.dots span:nth-child(3){animation-delay:.3s;}
.ld-bar-wrap{width:100%;max-width:260px;height:6px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;}
.ld-bar{height:100%;background:#fff;border-radius:10px;width:0%;transition:width .3s;}
#p-results{background:var(--warm);}
.res-header{background:linear-gradient(135deg,#f4845f,#e63946,#c1121f);padding:18px 16px 20px;color:#fff;box-shadow:var(--sh);flex-shrink:0;}
.res-header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.back-btn{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.res-header-top h2{font-size:13px;font-weight:700;flex:1;line-height:1.4;}
.res-badge{font-size:11px;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;border:1px solid rgba(255,255,255,.3);white-space:nowrap;}
.res-q-box{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-size:13px;color:rgba(255,255,255,.95);line-height:1.6;border:1px solid rgba(255,255,255,.25);}
.res-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;}
.sc-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh2);border:2px solid rgba(230,57,70,.12);animation:cardIn .4s ease both;}
.sc-head{padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#f4845f,#e63946);color:#fff;}
.sc-av{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.sc-info{flex:1;}
.sc-nm{font-size:13.5px;font-weight:700;}
.sc-tl{font-size:10.5px;opacity:.75;}
.ruling-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot-halal{background:#22c55e;}
.dot-haram{background:#ef4444;}
.dot-makruh{background:#f97316;}
.dot-khilaf{background:#94a3b8;}
.src-btn{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 8px;color:#fff;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;}
.no-src{color:#ef4444;font-size:11px;flex-shrink:0;padding:4px 8px;border:1px solid rgba(239,68,68,.3);border-radius:8px;background:rgba(239,68,68,.08);}
.sc-body{padding:14px 16px;}
.sc-ans{font-size:14px;line-height:1.9;color:#2a2a2a;margin-bottom:10px;}
.sc-ev{border-radius:12px;padding:10px 14px;background:rgba(230,57,70,.05);border:1px solid rgba(230,57,70,.12);font-size:12.5px;line-height:1.7;display:flex;gap:8px;}
.sc-ev-icon{font-size:14px;flex-shrink:0;margin-top:2px;}
.sc-ev-ref{font-weight:700;display:block;margin-bottom:2px;color:#c1121f;}
.sum-card{background:linear-gradient(135deg,#e63946,#c1121f);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(230,57,70,.3);color:#fff;}
.sum-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sum-badge{background:rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.3);}
.sum-text{font-size:13.5px;line-height:1.85;}
.new-btn{background:linear-gradient(135deg,#f4845f,#e63946);color:#fff;border:none;border-radius:14px;padding:15px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(230,57,70,.3);display:flex;align-items:center;justify-content:center;gap:8px;}
.disc{background:#fff;border:1.5px solid rgba(230,57,70,.15);border-radius:14px;padding:16px;font-size:13px;color:#555;line-height:1.8;display:flex;flex-direction:column;gap:10px;}
.contact-link{display:inline-flex;align-items:center;gap:8px;color:#e63946;font-size:14px;font-weight:700;text-decoration:none;padding:10px 16px;background:rgba(230,57,70,.08);border-radius:10px;border:1px solid rgba(230,57,70,.2);width:100%;justify-content:center;}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div class="page active" id="p-home">
  <div class="top-half">
    <img src="https://raw.githubusercontent.com/ahmed-alfailakawi/fatwa-bot/main/logo.png" class="logo-img" onerror="this.style.display='none';document.getElementById('logo-text').style.display='block'" alt="سَل العلماء">
    <div id="logo-text" style="display:none;font-family:'Amiri',serif;font-size:52px;color:#fff;font-weight:700;">سَل</div>
    <div class="logo-sub">سَل العُلماء بالذكاء الاصطناعي</div>
  </div>
  <div class="bottom-half">
    <div class="card">
      <div class="tabs-wrap">
        <button class="tab-btn active" id="tab-fatwa" onclick="switchTab('fatwa')">📚 الفتاوى</button>
        <button class="tab-btn" id="tab-hadith" onclick="switchTab('hadith')">🔍 تخريج الأحاديث</button>
      </div>
      <div id="fatwa-section">
        <span class="search-label">البحث عن الإجابة على ضوء منهج أهل السنة والجماعة</span>
        <div class="search-box">
          <input class="search-input" id="mainInput" type="text" placeholder="ما حكم...؟" onkeydown="if(event.key==='Enter')doSearch('fatwa')">
          <button class="search-go" id="goBtn" onclick="doSearch('fatwa')">🔍</button>
        </div>
      </div>
      <div id="hadith-section" style="display:none">
        <span class="search-label">البحث عن صحة الأحاديث الواردة في الصحيحين</span>
        <div class="search-box">
          <input class="search-input" id="hadithInput" type="text" placeholder="نص الحديث..." onkeydown="if(event.key==='Enter')doSearch('hadith')">
          <button class="search-go" id="hadithBtn" onclick="doSearch('hadith')">🔍</button>
        </div>
      </div>
      <div class="credits">جميع الإجابات من منهج أهل السنة والجماعة</div>
    </div>
  </div>
</div>

<div class="page" id="p-loading">
  <div class="ld-mosque">🕌</div>
  <div class="ld-title" id="ldTitle">جاري البحث...</div>
  <div class="ld-sub" id="ldSub">سبحان الله</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ldBar"></div></div>
</div>

<div class="page" id="p-results">
  <div class="res-header">
    <div class="res-header-top">
      <button class="back-btn" onclick="goTo('home')">←</button>
      <h2 id="resTitle">جميع الإجابات على ضوء منهج أهل السنة والجماعة</h2>
      <span class="res-badge" id="resBadge">فتوى</span>
    </div>
    <div class="res-q-box" id="resQ"></div>
  </div>
  <div class="res-body" id="resBody"></div>
</div>

<script>
const SCHOLARS=[
  {id:'alkamees',  name:'الشيخ د. عثمان الخميس',    title:'حفظه الله', icon:'▶️', hasSource:true},
  {id:'aljaser',   name:'الشيخ د. مطلق الجاسر',     title:'حفظه الله', icon:'▶️', hasSource:true},
  {id:'albani',    name:'الشيخ الألباني',            title:'رحمه الله', icon:'📖', hasSource:false},
  {id:'binbaz',    name:'الشيخ ابن باز',             title:'رحمه الله', icon:'📚', hasSource:false},
  {id:'uthaymeen', name:'الشيخ ابن عثيمين',          title:'رحمه الله', icon:'📜', hasSource:false},
  {id:'alshikh',   name:'الشيخ صالح آل الشيخ',      title:'حفظه الله', icon:'🎓', hasSource:false},
  {id:'fawzan',    name:'الشيخ الفوزان',             title:'حفظه الله', icon:'📋', hasSource:false},
  {id:'abdulaziz', name:'الشيخ عبدالعزيز آل الشيخ', title:'حفظه الله', icon:'🏛',  hasSource:false},
  {id:'albader',   name:'الشيخ عبدالرزاق البدر',    title:'حفظه الله', icon:'📗', hasSource:false},
];

const DHIKR=['سبحان الله','الحمد لله','الله أكبر','اللهم صلِّ على محمد','لا إله إلا الله','لا حول ولا قوة إلا بالله'];
let dhikrTimer=null,currentMode='fatwa',barTimer=null;

function goTo(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  document.getElementById('p-'+id).scrollTop=0;
}

function switchTab(mode){
  currentMode=mode;
  document.getElementById('tab-fatwa').classList.toggle('active',mode==='fatwa');
  document.getElementById('tab-hadith').classList.toggle('active',mode==='hadith');
  document.getElementById('fatwa-section').style.display=mode==='fatwa'?'block':'none';
  document.getElementById('hadith-section').style.display=mode==='hadith'?'block':'none';
}

function startDhikr(){
  let i=0;
  document.getElementById('ldSub').textContent=DHIKR[0];
  dhikrTimer=setInterval(()=>{i=(i+1)%DHIKR.length;document.getElementById('ldSub').textContent=DHIKR[i];},1500);
}
function stopDhikr(){clearInterval(dhikrTimer);}

function startBar(){
  const b=document.getElementById('ldBar');
  b.style.width='0%';let p=0;
  clearInterval(barTimer);
  barTimer=setInterval(()=>{p=Math.min(p+(p<40?3:p<70?1.5:.4),90);b.style.width=p+'%';if(p>=90)clearInterval(barTimer);},150);
}
function finishBar(){clearInterval(barTimer);document.getElementById('ldBar').style.width='100%';}

function getRulingDot(r){
  if(!r)return 'dot-khilaf';
  const v=r.toLowerCase();
  if(v.includes('halal'))return 'dot-halal';
  if(v.includes('haram'))return 'dot-haram';
  if(v.includes('makruh'))return 'dot-makruh';
  return 'dot-khilaf';
}

async function doSearch(mode){
  const q=mode==='fatwa'?document.getElementById('mainInput').value.trim():document.getElementById('hadithInput').value.trim();
  if(!q)return;
  const btn=mode==='fatwa'?document.getElementById('goBtn'):document.getElementById('hadithBtn');
  btn.disabled=true;
  goTo('loading');startBar();startDhikr();
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:mode})});
    const data=await r.json();
    finishBar();stopDhikr();
    if(data.error)throw new Error(data.error);
    mode==='fatwa'?renderFatwa(q,data):renderHadith(q,data);
    goTo('results');
  }catch(err){
    finishBar();stopDhikr();
    renderError(q,String(err));
    goTo('results');
  }
  btn.disabled=false;
}

function renderFatwa(q,data){
  document.getElementById('resQ').textContent=q;
  document.getElementById('resTitle').textContent='جميع الإجابات على ضوء منهج أهل السنة والجماعة';
  document.getElementById('resBadge').textContent='📚 فتوى';
  const body=document.getElementById('resBody');
  body.innerHTML='';
  SCHOLARS.forEach((sc,i)=>{
    const d=data[sc.id];if(!d)return;
    const dot=getRulingDot(d.ruling||'');
    const card=document.createElement('div');
    card.className='sc-card';
    card.style.animationDelay=(i*.08)+'s';
    let srcHtml='';
    if(sc.hasSource&&d.sourceUrl){
      srcHtml='<a href="'+d.sourceUrl+'" target="_blank" class="src-btn">▶ مشاهدة</a>';
    } else if(!sc.hasSource){
      srcHtml='<span class="no-src">لا يوجد مصدر</span>';
    }
    card.innerHTML='<div class="sc-head"><div class="sc-av">'+sc.icon+'</div><div class="sc-info"><div class="sc-nm">'+sc.name+'</div><div class="sc-tl">'+sc.title+'</div></div>'+srcHtml+'<div class="ruling-dot '+dot+'"></div></div><div class="sc-body"><div class="sc-ans">'+d.answer+'</div>'+(d.evidence?'<div class="sc-ev"><div class="sc-ev-icon">📌</div><div><span class="sc-ev-ref">الدليل</span>'+d.evidence+'</div></div>':'')+'</div>';
    body.appendChild(card);
  });
  if(data.summary){
    const s=document.createElement('div');
    s.className='sum-card';
    s.innerHTML='<div class="sum-top"><span style="font-size:20px">✨</span><span class="sum-badge">خلاصة الأقوال</span></div><div class="sum-text">'+data.summary+'</div>';
    body.appendChild(s);
  }
  appendFooter(body);
}

function renderHadith(q,data){
  document.getElementById('resQ').textContent=q;
  document.getElementById('resTitle').textContent='تخريج الحديث';
  document.getElementById('resBadge').textContent='🔍 حديث';
  const body=document.getElementById('resBody');
  body.innerHTML='';
  const grades={sahih:'dot-halal',hasan:'dot-hasan',daif:'dot-makruh',mawdu:'dot-haram'};
  const g=(data.grade||'').toLowerCase();
  const dot=g.includes('صحيح')||g.includes('sahih')?'dot-halal':g.includes('حسن')||g.includes('hasan')?'dot-hasan':g.includes('ضعيف')||g.includes('daif')?'dot-makruh':'dot-haram';
  const card=document.createElement('div');
  card.className='sc-card';
  const srcBtn=data.sourceUrl?'<a href="'+data.sourceUrl+'" target="_blank" class="src-btn">🔗 المصدر</a>':'';
  card.innerHTML='<div class="sc-head"><span style="font-size:22px">📜</span><div class="sc-info"><div class="sc-nm">نص الحديث</div><div class="sc-tl">التحقق من الصحة</div></div>'+srcBtn+'<div class="ruling-dot '+dot+'"></div></div><div class="sc-body"><div style="font-family:Amiri,serif;font-size:16px;line-height:2;color:#1a1a1a;padding:12px 14px;background:rgba(230,57,70,.04);border-radius:10px;border-right:3px solid #e63946;margin-bottom:10px">'+(data.text||q)+'</div><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#f9f9f9;border:1px solid #eee;margin-bottom:10px"><div class="ruling-dot '+dot+'"></div><span style="font-size:12px;color:#888">درجة الحديث:</span><span style="font-size:13px;font-weight:700">'+(data.grade||'غير محدد')+'</span></div><div style="font-size:12.5px;color:#555;padding:10px 14px;background:rgba(230,57,70,.04);border-radius:10px;border:1px solid rgba(230,57,70,.1)"><span style="font-weight:700;color:#c1121f;display:block;margin-bottom:4px">📚 المصدر</span>'+(data.source||'لم يُعثر على مصدر')+'</div>'+(data.scholars?'<div style="margin-top:8px;font-size:12.5px;color:#555;padding:10px 14px;background:rgba(230,57,70,.04);border-radius:10px;border:1px solid rgba(230,57,70,.1)"><span style="font-weight:700;color:#c1121f;display:block;margin-bottom:4px">👨‍🎓 أقوال العلماء</span>'+data.scholars+'</div>':'')+'</div>';
  body.appendChild(card);
  appendFooter(body);
}

function appendFooter(body){
  const btn=document.createElement('button');
  btn.className='new-btn';
  btn.innerHTML=currentMode==='fatwa'?'🔍 سؤال جديد':'🔍 بحث جديد';
  btn.onclick=()=>goTo('home');
  body.appendChild(btn);
  const disc=document.createElement('div');
  disc.className='disc';
  disc.innerHTML='<div><span style="font-size:18px">⚠️</span> هذا البوت تعليمي استرشادي فقط، ولا يُغني عن مراجعة العلماء الثقات مباشرةً في المسائل الشرعية المهمة.</div><a href="mailto:ahmed.fy2015@gmail.com" class="contact-link">✉️ تواصل واقتراحات</a>';
  body.appendChild(disc);
}

function renderError(q,detail){
  document.getElementById('resQ').textContent=q;
  document.getElementById('resTitle').textContent='حدث خطأ';
  document.getElementById('resBadge').textContent='';
  document.getElementById('resBody').innerHTML='<div style="padding:40px 20px;text-align:center"><div style="font-size:52px;margin-bottom:14px">⚠️</div><div style="font-size:16px;font-weight:700;color:#c1121f;margin-bottom:16px">تعذّر الحصول على الإجابة</div><button class="new-btn" onclick="goTo(\'home\')" style="max-width:220px;margin:0 auto">← حاول مجدداً</button></div>';
}
</script>
</body>
</html>
