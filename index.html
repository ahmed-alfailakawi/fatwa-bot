<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FATWA</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#7B1C1C;
  --primary-light:#9B2626;
  --primary-dark:#5C1515;
  --bg:#F0EDED;
  --card:#FFFFFF;
  --text:#1a1a1a;
  --sub:#999;
  --sh:0 4px 20px rgba(0,0,0,.07);
  --sh2:0 4px 16px rgba(123,28,28,.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Tajawal',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;}
.page{display:none;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;}
.page.active{display:flex;}

/* ===== HOME PAGE ===== */
#p-home{background:var(--bg);}

.home-content{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:56px 24px 24px;
}

.logo-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:16px;
}
.mosque-svg{
  width:100px;
  height:118px;
  margin-bottom:10px;
}
.brand-title{
  font-family:'Tajawal',sans-serif;
  font-size:34px;
  font-weight:900;
  color:var(--primary);
  letter-spacing:6px;
  margin-bottom:5px;
}
.brand-sub{
  font-size:13px;
  color:var(--sub);
  font-weight:400;
}

.orn-div{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  max-width:260px;
  margin:16px 0 28px;
}
.orn-line{
  flex:1;
  height:1px;
  background:var(--primary);
  opacity:.35;
}
.orn-icon{
  color:var(--primary);
  font-size:15px;
  opacity:.65;
}

.feat-row{
  display:flex;
  gap:10px;
  width:100%;
  max-width:390px;
  margin-bottom:28px;
}
.feat-card{
  flex:1;
  background:var(--card);
  border-radius:18px;
  padding:16px 6px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  box-shadow:var(--sh);
  border:none;
  cursor:pointer;
  transition:transform .15s, box-shadow .15s;
  font-family:'Tajawal',sans-serif;
}
.feat-card:active{transform:scale(.95);box-shadow:none;}
.feat-card svg{
  width:26px;
  height:26px;
}
.feat-label{
  font-size:11px;
  font-weight:700;
  color:var(--text);
  text-align:center;
  line-height:1.35;
}

.search-wrap{
  width:100%;
  max-width:390px;
  margin-bottom:20px;
}
.search-box{
  display:flex;
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--sh);
  overflow:visible;
  align-items:center;
}
.search-input{
  flex:1;
  border:none;
  outline:none;
  padding:14px 16px;
  font-family:'Tajawal',sans-serif;
  font-size:14px;
  color:var(--text);
  background:transparent;
  min-width:0;
  direction:rtl;
  border-radius:16px 0 0 16px;
}
.search-input::placeholder{color:#ccc;}
.search-go{
  background:var(--primary);
  border:none;
  width:52px;
  height:52px;
  cursor:pointer;
  border-radius:12px;
  margin:4px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .2s;
}
.search-go:disabled{opacity:.4;cursor:not-allowed;}
.search-go svg{
  width:22px;
  height:22px;
  stroke:#fff;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.home-tagline{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--sub);
  text-align:center;
  padding:0 8px;
}
.home-tagline-icon{
  font-size:15px;
  color:var(--primary);
  opacity:.6;
  flex-shrink:0;
}

/* Bottom Nav */
.bottom-nav-wrapper{
  position:relative;
  flex-shrink:0;
}
.bottom-nav-bar{
  height:74px;
  background:var(--primary);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 36px;
  border-radius:28px 28px 0 0;
}
.nav-side-btn{
  background:transparent;
  border:none;
  cursor:pointer;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.75);
  font-size:22px;
  letter-spacing:2px;
  font-weight:700;
}
.nav-side-btn svg{
  width:24px;
  height:24px;
  stroke:rgba(255,255,255,.75);
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav-center-float{
  position:absolute;
  top:-32px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
}
.nav-home-btn{
  width:62px;
  height:62px;
  background:var(--card);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
  border:none;
  cursor:pointer;
}
.nav-home-btn svg{
  width:30px;
  height:36px;
}
.nav-home-label{
  font-size:11px;
  color:rgba(255,255,255,.92);
  font-family:'Tajawal',sans-serif;
  font-weight:600;
  margin-top:6px;
}

/* ===== LOADING PAGE ===== */
#p-loading{
  background:var(--bg);
  align-items:center;
  justify-content:center;
}
.ld-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:44px;
}
.ld-mosque-svg{
  width:160px;
  height:200px;
}
.ld-path{
  stroke:var(--primary);
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.ld-dhikr-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  min-height:60px;
  justify-content:center;
}
.ld-dhikr-label{
  font-size:10px;
  color:var(--sub);
  letter-spacing:1.5px;
  font-weight:500;
  text-transform:uppercase;
  opacity:.7;
}
.ld-dhikr{
  font-family:'Tajawal',sans-serif;
  font-size:20px;
  color:var(--primary);
  font-weight:500;
  text-align:center;
  transition:opacity 0.35s ease, transform 0.35s ease;
  min-width:240px;
}

/* ===== RESULTS PAGE ===== */
#p-results{background:var(--bg);overflow-y:auto;}
.res-header{background:linear-gradient(160deg,var(--primary-light),var(--primary),var(--primary-dark));padding:18px 16px 20px;color:#fff;box-shadow:0 6px 24px rgba(91,21,21,.25);flex-shrink:0;}
.res-header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.back-btn{width:36px;height:36px;background:rgba(255,255,255,.18);border-radius:10px;border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.res-header-top h2{font-size:13px;font-weight:700;flex:1;line-height:1.4;}
.res-badge{font-size:11px;background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;border:1px solid rgba(255,255,255,.28);white-space:nowrap;}
.res-q-box{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;font-size:13px;color:rgba(255,255,255,.95);line-height:1.6;border:1px solid rgba(255,255,255,.22);}
.res-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;}
.sc-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh2);border:1.5px solid rgba(123,28,28,.1);animation:cardIn .4s ease both;}
.sc-head{padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;}
.sc-av{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-family:'Tajawal',sans-serif;flex-shrink:0;color:#fff;letter-spacing:0;}
.sc-info{flex:1;}
.sc-nm{font-size:13.5px;font-weight:700;}
.sc-tl{font-size:10.5px;opacity:.75;}
.ruling-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot-halal{background:#22c55e;}
.dot-haram{background:#ef4444;}
.dot-makruh{background:#f97316;}
.dot-khilaf{background:#94a3b8;}
.src-btn{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.38);border-radius:8px;padding:4px 10px;color:#fff;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;}
.no-src{color:rgba(255,255,255,.6);font-size:11px;flex-shrink:0;padding:3px 8px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.08);}
.sc-body{padding:14px 16px;}
.sc-ans{font-size:14px;line-height:1.9;color:#2a2a2a;margin-bottom:10px;}
.sc-ev{border-radius:12px;padding:10px 14px;background:rgba(123,28,28,.04);border:1px solid rgba(123,28,28,.1);font-size:12.5px;line-height:1.7;display:flex;gap:8px;}
.sc-ev-line{width:3px;background:var(--primary);border-radius:2px;flex-shrink:0;}
.sc-ev-ref{font-weight:700;display:block;margin-bottom:2px;color:var(--primary);}
.sum-card{background:linear-gradient(135deg,var(--primary-light),var(--primary-dark));border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(91,21,21,.22);color:#fff;}
.sum-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sum-badge{background:rgba(255,255,255,.18);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.28);}
.sum-text{font-size:13.5px;line-height:1.85;}
.new-btn{background:linear-gradient(135deg,var(--primary-light),var(--primary));color:#fff;border:none;border-radius:14px;padding:15px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(91,21,21,.25);display:flex;align-items:center;justify-content:center;gap:8px;}
.disc{background:#fff;border:1.5px solid rgba(123,28,28,.1);border-radius:14px;padding:16px;font-size:13px;color:#555;line-height:1.8;display:flex;flex-direction:column;gap:10px;}
.contact-link{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-size:14px;font-weight:700;text-decoration:none;padding:10px 16px;background:rgba(123,28,28,.06);border-radius:10px;border:1px solid rgba(123,28,28,.18);width:100%;justify-content:center;}

@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- HOME PAGE -->
<div class="page active" id="p-home">
  <div class="home-content">

    <!-- Logo -->
    <div class="logo-wrap">
      <svg class="mosque-svg" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#7B1C1C" stroke-linecap="round" stroke-linejoin="round">
        <!-- Left side flourish -->
        <path d="M18,60 C5,52 6,33 18,25" stroke-width="2.8"/>
        <!-- Right side flourish -->
        <path d="M62,60 C75,52 74,33 62,25" stroke-width="2.8"/>
        <!-- Outer main arch -->
        <path d="M18,60 C18,26 40,6 40,6 C40,6 62,26 62,60" stroke-width="3.2"/>
        <!-- Inner arch -->
        <path d="M26,60 C26,30 40,14 40,14 C40,14 54,30 54,60" stroke-width="2.6"/>
        <!-- Door arch (mihrab) -->
        <path d="M33,60 C33,45 40,39 40,39 C40,39 47,45 47,60" stroke-width="2.2"/>
        <!-- Door left side -->
        <line x1="33" y1="60" x2="33" y2="80" stroke-width="2.2"/>
        <!-- Door right side -->
        <line x1="47" y1="60" x2="47" y2="80" stroke-width="2.2"/>
        <!-- Ground base line -->
        <line x1="12" y1="82" x2="68" y2="82" stroke-width="2.8"/>
      </svg>
      <div class="brand-title">FATWA</div>
      <div class="brand-sub">فتوى موثوقة... من مصادر معتمدة</div>
    </div>

    <!-- Ornament divider -->
    <div class="orn-div">
      <div class="orn-line"></div>
      <span class="orn-icon">❋</span>
      <div class="orn-line"></div>
    </div>

    <!-- Feature cards (RTL: right = first) -->
    <div class="feat-row">
      <!-- ابحث عن فتوى -->
      <button class="feat-card" onclick="focusSearch('fatwa')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7B1C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
        <span class="feat-label">ابحث عن فتوى</span>
      </button>
      <!-- استخراج الاحاديث -->
      <button class="feat-card" onclick="focusSearch('hadith')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7B1C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="feat-label">استخراج الاحاديث</span>
      </button>
      <!-- سؤال ديني عام -->
      <button class="feat-card" onclick="focusSearch('general')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7B1C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="10" r="1" fill="#7B1C1C"/>
          <path d="M12 7v0a2 2 0 0 1 1.5 3.3L12 12"/>
        </svg>
        <span class="feat-label">سؤال ديني عام</span>
      </button>
      <!-- تاريخ البحث -->
      <button class="feat-card" onclick="showHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7B1C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.49"/>
          <polyline points="12 7 12 12 15 14"/>
        </svg>
        <span class="feat-label">تاريخ البحث</span>
      </button>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search-box">
        <input class="search-input" id="mainInput" type="text" placeholder="ما حكم...؟" onkeydown="if(event.key==='Enter')doSearch(currentMode)">
        <button class="search-go" id="goBtn" onclick="doSearch(currentMode)">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tagline -->
    <div class="home-tagline">
      <span class="home-tagline-icon">❋</span>
      <span>البحث عن الإجابة على ضوء منهج أهل السنة والجماعة</span>
    </div>

  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav-wrapper">
    <div class="nav-center-float">
      <button class="nav-home-btn" onclick="goTo('home')">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#7B1C1C" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18,60 C5,52 6,33 18,25" stroke-width="2.8"/>
          <path d="M62,60 C75,52 74,33 62,25" stroke-width="2.8"/>
          <path d="M18,60 C18,26 40,6 40,6 C40,6 62,26 62,60" stroke-width="3.2"/>
          <path d="M26,60 C26,30 40,14 40,14 C40,14 54,30 54,60" stroke-width="2.6"/>
          <path d="M33,60 C33,45 40,39 40,39 C40,39 47,45 47,60" stroke-width="2.2"/>
          <line x1="33" y1="60" x2="33" y2="80" stroke-width="2.2"/>
          <line x1="47" y1="60" x2="47" y2="80" stroke-width="2.2"/>
          <line x1="12" y1="82" x2="68" y2="82" stroke-width="2.8"/>
        </svg>
      </button>
      <span class="nav-home-label">الرئيسية</span>
    </div>
    <div class="bottom-nav-bar">
      <button class="nav-side-btn">•••</button>
      <div style="width:72px"></div>
      <button class="nav-side-btn">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- LOADING PAGE -->
<div class="page" id="p-loading">
  <div class="ld-center">
    <svg class="ld-mosque-svg" viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
      <path class="ld-path" d="M18,60 C5,52 6,33 18,25" stroke-width="2.8"/>
      <path class="ld-path" d="M62,60 C75,52 74,33 62,25" stroke-width="2.8"/>
      <path class="ld-path" d="M18,60 C18,26 40,6 40,6 C40,6 62,26 62,60" stroke-width="3.2"/>
      <path class="ld-path" d="M26,60 C26,30 40,14 40,14 C40,14 54,30 54,60" stroke-width="2.6"/>
      <path class="ld-path" d="M33,60 C33,45 40,39 40,39 C40,39 47,45 47,60" stroke-width="2.2"/>
      <path class="ld-path" d="M33,60 L33,80" stroke-width="2.2"/>
      <path class="ld-path" d="M47,60 L47,80" stroke-width="2.2"/>
      <path class="ld-path" d="M12,82 L68,82" stroke-width="2.8"/>
    </svg>
    <div class="ld-dhikr-wrap">
      <div class="ld-dhikr-label">الباقيات الصالحات</div>
      <div class="ld-dhikr" id="ldDhikr">سبحان الله</div>
    </div>
  </div>
</div>

<!-- RESULTS PAGE -->
<div class="page" id="p-results">
  <div class="res-header">
    <div class="res-header-top">
      <button class="back-btn" onclick="goTo('home')">←</button>
      <h2 id="resTitle">جميع الإجابات على ضوء منهج أهل السنة والجماعة</h2>
      <span class="res-badge" id="resBadge">فتوى</span>
    </div>
    <div class="res-q-box" id="resQ"></div>
  </div>
  <div class="res-body" id="resBody"></div>
</div>

<script>
const SCHOLARS=[
  {id:'alkamees',  name:'الشيخ د. عثمان الخميس',    title:'حفظه الله', abbr:'خم', hasSource:true},
  {id:'aljaser',   name:'الشيخ د. مطلق الجاسر',     title:'حفظه الله', abbr:'جا', hasSource:true},
  {id:'albani',    name:'الشيخ الألباني',            title:'رحمه الله', abbr:'أل', hasSource:false},
  {id:'binbaz',    name:'الشيخ ابن باز',             title:'رحمه الله', abbr:'بز', hasSource:false},
  {id:'uthaymeen', name:'الشيخ ابن عثيمين',          title:'رحمه الله', abbr:'عث', hasSource:false},
  {id:'alshikh',   name:'الشيخ صالح آل الشيخ',      title:'حفظه الله', abbr:'صا', hasSource:false},
  {id:'fawzan',    name:'الشيخ الفوزان',             title:'حفظه الله', abbr:'فو', hasSource:false},
  {id:'abdulaziz', name:'الشيخ عبدالعزيز آل الشيخ', title:'حفظه الله', abbr:'عز', hasSource:false},
  {id:'albader',   name:'الشيخ عبدالرزاق البدر',    title:'حفظه الله', abbr:'بد', hasSource:false},
];

const DHIKR_LIST=[
  'سبحان الله',
  'الحمد لله',
  'لا إله إلا الله',
  'الله أكبر',
  'لا حول ولا قوة إلا بالله',
  'أستغفر الله',
  'سبحان الله وبحمده',
  'سبحان الله العظيم',
  'اللهم صلِّ على محمد'
];
const PLACEHOLDERS={fatwa:'ما حكم...؟',hadith:'نص الحديث...',general:'اكتب سؤالك الديني...'};
let dhikrTimer=null,dhikrIdx=0,currentMode='fatwa';
let drawAnimFrame=null,drawCycleStart=0,isDrawComplete=false,pathLengths=[];

function goTo(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+id).classList.add('active');
  document.getElementById('p-'+id).scrollTop=0;
}

function focusSearch(mode){
  currentMode=mode==='general'?'fatwa':mode;
  const input=document.getElementById('mainInput');
  input.placeholder=PLACEHOLDERS[mode]||PLACEHOLDERS.fatwa;
  input.focus();
  input.scrollIntoView({behavior:'smooth',block:'center'});
}

function showHistory(){
  const h=JSON.parse(localStorage.getItem('fatwa-history')||'[]');
  if(!h.length){alert('لا يوجد تاريخ بحث بعد');return;}
  document.getElementById('mainInput').value=h[h.length-1];
  document.getElementById('mainInput').focus();
}

/* ---- Draw Animation ---- */
function initPaths(){
  const paths=[...document.querySelectorAll('#p-loading .ld-path')];
  pathLengths=[];
  paths.forEach(p=>{
    let len=200;
    try{len=p.getTotalLength();}catch(e){}
    pathLengths.push(len);
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
    p.style.opacity='0';
  });
  return paths;
}

function startDrawAnimation(){
  isDrawComplete=false;
  const paths=initPaths();
  const N=paths.length;
  const DRAW=3400,HOLD=700,FADE=500,TOTAL=DRAW+HOLD+FADE;
  drawCycleStart=performance.now();

  function tick(now){
    if(isDrawComplete){
      paths.forEach((p,i)=>{p.style.strokeDashoffset='0';p.style.opacity='1';});
      return;
    }
    const elapsed=(now-drawCycleStart)%TOTAL;

    if(elapsed<DRAW){
      const t=elapsed/DRAW;
      paths.forEach((p,i)=>{
        const start=i/N;
        const prog=Math.max(0,Math.min(1,(t-start)*N));
        p.style.strokeDashoffset=pathLengths[i]*(1-prog);
        p.style.opacity=prog>0?'1':'0';
      });
    } else if(elapsed<DRAW+HOLD){
      paths.forEach(p=>{p.style.strokeDashoffset='0';p.style.opacity='1';});
    } else {
      const ft=(elapsed-DRAW-HOLD)/FADE;
      const op=Math.max(0,1-ft).toFixed(2);
      paths.forEach((p,i)=>{
        p.style.opacity=op;
        if(ft>0.8)p.style.strokeDashoffset=pathLengths[i];
      });
      if(ft>=1)drawCycleStart=now;
    }
    drawAnimFrame=requestAnimationFrame(tick);
  }
  drawAnimFrame=requestAnimationFrame(tick);
}

function stopDrawAnimation(){
  isDrawComplete=true;
  setTimeout(()=>{cancelAnimationFrame(drawAnimFrame);drawAnimFrame=null;},150);
}

/* ---- Dhikr Rotation ---- */
function startDhikr(){
  const el=document.getElementById('ldDhikr');
  dhikrIdx=0;
  el.textContent=DHIKR_LIST[0];
  el.style.opacity='1';
  el.style.transform='translateY(0)';

  dhikrTimer=setInterval(()=>{
    el.style.opacity='0';
    el.style.transform='translateY(-6px)';
    setTimeout(()=>{
      dhikrIdx=(dhikrIdx+1)%DHIKR_LIST.length;
      el.textContent=DHIKR_LIST[dhikrIdx];
      el.style.transform='translateY(6px)';
      el.style.opacity='0';
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          el.style.opacity='1';
          el.style.transform='translateY(0)';
        });
      });
    },350);
  },1500);
}

function stopDhikr(){clearInterval(dhikrTimer);}

function getRulingDot(r){
  if(!r)return 'dot-khilaf';
  const v=r.toLowerCase();
  if(v.includes('halal'))return 'dot-halal';
  if(v.includes('haram'))return 'dot-haram';
  if(v.includes('makruh'))return 'dot-makruh';
  return 'dot-khilaf';
}

async function doSearch(mode){
  const q=document.getElementById('mainInput').value.trim();
  if(!q)return;
  const btn=document.getElementById('goBtn');
  btn.disabled=true;
  const h=JSON.parse(localStorage.getItem('fatwa-history')||'[]');
  h.push(q);if(h.length>20)h.shift();
  localStorage.setItem('fatwa-history',JSON.stringify(h));
  goTo('loading');
  startDrawAnimation();
  startDhikr();
  try{
    const apiMode=mode==='general'?'fatwa':mode;
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:apiMode})});
    const data=await r.json();
    stopDhikr();
    stopDrawAnimation();
    if(data.error)throw new Error(data.error);
    await new Promise(res=>setTimeout(res,550));
    apiMode==='fatwa'?renderFatwa(q,data):renderHadith(q,data);
    goTo('results');
  }catch(err){
    stopDhikr();
    stopDrawAnimation();
    await new Promise(res=>setTimeout(res,300));
    renderError(q,String(err));
    goTo('results');
  }
  btn.disabled=false;
}

function renderFatwa(q,data){
  document.getElementById('resQ').textContent=q;
  document.getElementById('resTitle').textContent='جميع الإجابات على ضوء منهج أهل السنة والجماعة';
  document.getElementById('resBadge').textContent='فتوى';
  const body=document.getElementById('resBody');
  body.innerHTML='';
  SCHOLARS.forEach((sc,i)=>{
    const d=data[sc.id];if(!d)return;
    const dot=getRulingDot(d.ruling||'');
    const card=document.createElement('div');
    card.className='sc-card';
    card.style.animationDelay=(i*.08)+'s';
    let srcHtml='';
    if(sc.hasSource&&d.sourceUrl){
      srcHtml='<a href="'+d.sourceUrl+'" target="_blank" class="src-btn">مشاهدة</a>';
    }else if(!sc.hasSource){
      srcHtml='<span class="no-src">غير متاح</span>';
    }
    card.innerHTML='<div class="sc-head"><div class="sc-av">'+sc.abbr+'</div><div class="sc-info"><div class="sc-nm">'+sc.name+'</div><div class="sc-tl">'+sc.title+'</div></div>'+srcHtml+'<div class="ruling-dot '+dot+'"></div></div><div class="sc-body"><div class="sc-ans">'+d.answer+'</div>'+(d.evidence?'<div class="sc-ev"><div class="sc-ev-line"></div><div><span class="sc-ev-ref">الدليل</span>'+d.evidence+'</div></div>':'')+'</div>';
    body.appendChild(card);
  });
  if(data.summary){
    const s=document.createElement('div');
    s.className='sum-card';
    s.innerHTML='<div class="sum-top"><span class="sum-badge">خلاصة الأقوال</span></div><div class="sum-text">'+data.summary+'</div>';
    body.appendChild(s);
  }
  appendFooter(body);
}

function renderHadith(q,data){
  document.getElementById('resQ').textContent=q;
  document.getElementById('resTitle').textContent='تخريج الحديث';
  document.getElementById('resBadge').textContent='حديث';
  const body=document.getElementById('resBody');
  body.innerHTML='';
  const g=(data.grade||'').toLowerCase();
  const dot=g.includes('صحيح')||g.includes('sahih')?'dot-halal':g.includes('حسن')||g.includes('hasan')?'dot-hasan':g.includes('ضعيف')||g.includes('daif')?'dot-makruh':'dot-haram';
  const card=document.createElement('div');
  card.className='sc-card';
  const srcBtn=data.sourceUrl?'<a href="'+data.sourceUrl+'" target="_blank" class="src-btn">المصدر</a>':'';
  card.innerHTML='<div class="sc-head"><div class="sc-av">حد</div><div class="sc-info"><div class="sc-nm">نص الحديث</div><div class="sc-tl">التحقق من الصحة</div></div>'+srcBtn+'<div class="ruling-dot '+dot+'"></div></div><div class="sc-body"><div style="font-family:Amiri,serif;font-size:16px;line-height:2;color:#1a1a1a;padding:12px 14px;background:rgba(123,28,28,.04);border-radius:10px;border-right:3px solid #7B1C1C;margin-bottom:10px">'+(data.text||q)+'</div><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#f9f9f9;border:1px solid #eee;margin-bottom:10px"><div class="ruling-dot '+dot+'"></div><span style="font-size:12px;color:#888">درجة الحديث:</span><span style="font-size:13px;font-weight:700">'+(data.grade||'غير محدد')+'</span></div><div style="font-size:12.5px;color:#555;padding:10px 14px;background:rgba(123,28,28,.04);border-radius:10px;border:1px solid rgba(123,28,28,.1)"><span style="font-weight:700;color:#7B1C1C;display:block;margin-bottom:4px">المصدر</span>'+(data.source||'لم يُعثر على مصدر')+'</div>'+(data.scholars?'<div style="margin-top:8px;font-size:12.5px;color:#555;padding:10px 14px;background:rgba(123,28,28,.04);border-radius:10px;border:1px solid rgba(123,28,28,.1)"><span style="font-weight:700;color:#7B1C1C;display:block;margin-bottom:4px">أقوال العلماء</span>'+data.scholars+'</div>':'')+'</div>';
  body.appendChild(card);
  appendFooter(body);
}

function appendFooter(body){
  const btn=document.createElement('button');
  btn.className='new-btn';
  btn.textContent=currentMode==='hadith'?'بحث جديد':'سؤال جديد';
  btn.onclick=()=>goTo('home');
  body.appendChild(btn);
  const disc=document.createElement('div');
  disc.className='disc';
  disc.innerHTML='<div style="color:#666;font-size:13px">تنبيه: هذه الأداة استرشادية تعليمية فقط، ولا تُغني عن مراجعة العلماء مباشرةً في المسائل الشرعية المهمة.</div><a href="mailto:ahmed.fy2015@gmail.com" class="contact-link">تواصل معنا واقتراحاتكم</a>';
  body.appendChild(disc);
}

  document.getElementById('resQ').textContent=q;

  document.getElementById('resBadge').textContent='';

}
